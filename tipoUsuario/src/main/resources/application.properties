spring.application.name=tipoUsuario
spring.datasource.url=jdbc:mysql://localhost:3306/hospital_tipo_usuario?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
# spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=8080
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Habilitar Flyway
spring.flyway.enabled=true
# Ruta donde buscarás los scripts SQL
spring.flyway.locations=classpath:db/migration
# Importante si ya tienes datos en la BD y no quieres empezar de cero
spring.flyway.baseline-on-migrate=true
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}


# 1. Define el nombre y la ruta del archivo de logs (relativa a la raíz del proyecto)
# logging.file.name=logs/app-dev.json
# 2. Activa el formato JSON estructurado nativo para el archivo
logging.structured.format.file=logstash
# 3. (Opcional) Si también quieres que la consola de tu IDE muestre JSON
logging.structured.format.console=logstash

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html
springdoc.api-docs.path=/api-docs